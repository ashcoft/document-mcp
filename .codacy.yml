---
engines:
  pyflakes:
    enabled: true
  pep8:
    enabled: true
  pylint:
    enabled: true

exclude_paths:
  - "tests/**"
  - "**/*_test.py"
  - "**/test_*.py"
  # Excluded from Codacy due to intentional security patterns (shell=False, /tmp usage)
  # that are properly validated. These are false positives for CAD processing code.
  - "src/ingestion/cad_extractor.py"
  # Vendored Nx wrapper generated by `nx init` (see nx.dev/recipes/installation/install-non-javascript).
  # Its dynamic requires and path construction are intentional; do not edit or fork it.
  - ".nx/nxw.js"
